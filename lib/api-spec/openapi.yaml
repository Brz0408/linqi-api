openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: LinQi B2B API — Company Account, Users, Roles, Permissions & Governance
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication (company users)
  - name: superadmin-auth
    description: Authentication (LinQi Super Admin)
  - name: companies
    description: Company management
  - name: users
    description: Company user management
  - name: invitations
    description: User invitations & OTP
  - name: roles
    description: Role management
  - name: permissions
    description: Permission management
  - name: audit
    description: Audit log
  - name: superadmin
    description: LinQi Super Admin operations
  - name: ai
    description: Company-scoped LinQi AI operations
  - name: marketplace
    description: Public marketplace catalog and taxonomy operations
  - name: catalog-imports
    description: Authenticated company catalog import, review, and draft-product operations
  - name: product-prices
    description: Authenticated company product pricing and MOQ tier operations
  - name: subscription-payments
    description: Manual Seller subscription payment submissions and Super Admin review

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
      required:
        - error

    CanonicalSubscriptionMutationError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            code: { type: string, const: SUBSCRIPTION_PLAN_MUTATION_DISABLED }
          required: [code]

    AiEntitlementError:
      type: object
      description: A server-side AI authorization error that includes a code when the authorization boundary provides one.
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - SELLER_REQUIRED
            - NO_SUBSCRIPTION
            - SUBSCRIPTION_INACTIVE
            - SUBSCRIPTION_CANCELLED
            - CAPABILITY_NOT_IN_PLAN
            - SUBSCRIPTION_EXPIRED
            - UNKNOWN_PLAN
            - TIER_MISMATCH
            - ACTION_PERMISSION_DENIED
      required: [error]

    AiActionConflictError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [ACTION_ALREADY_FINAL]
      required: [error, code]

    AiCapability:
      type: string
      description: Capability calculated by the server from the authenticated company's active subscription. Clients cannot select a capability.
      enum:
        - assistant
        - smart_search
        - product_basic
        - catalog
        - inventory_basic
        - orders_basic
        - sales_basic
        - reports_basic
        - recommendations
        - product_advanced
        - inventory_advanced
        - orders_advanced
        - sales_advanced
        - procurement
        - rfq_sales
        - warehouse
        - logistics
        - returns
        - finance_basic
        - analytics_advanced
        - anomaly_detection
        - cross_module_limited
        - predictive
        - business_intelligence
        - cross_module
        - finance_advanced
        - factory
        - logistics_advanced
        - customer_advanced
        - executive_reports

    AiEntitlements:
      type: object
      description: Server-calculated AI access for the authenticated company. This endpoint never accepts plan, tier, capability, or company data from the client.
      properties:
        policyVersion:
          type: string
        active:
          type: boolean
        planCode:
          type: [string, "null"]
        aiTier:
          type: [string, "null"]
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AiCapability"
        inactiveReason:
          type: string
          enum:
            - NO_SUBSCRIPTION
            - SUBSCRIPTION_INACTIVE
            - SUBSCRIPTION_CANCELLED
            - SUBSCRIPTION_EXPIRED
            - UNKNOWN_PLAN
            - TIER_MISMATCH
        modules:
          type: array
          items:
            type: string
      required: [policyVersion, active, planCode, aiTier, capabilities, modules]

    AiChatRequest:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        conversationId:
          type: string
          format: uuid
        locale:
          type: string
          enum: [en, ar, ku]
        module:
          type: string
          enum: [dashboard, products, inventory, orders, sales, customers, finance, reports, marketplace, procurement, messaging, settings]
      required: [message]

    AiPendingAction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        tool:
          type: string
        params:
          type: object
          additionalProperties: true
        summary:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, executed, failed, expired]
        result:
          type: [object, "null"]
          additionalProperties: true
        error:
          type: [string, "null"]
        approvedBy:
          type: [string, "null"]
          format: uuid
        approvedAt:
          type: [string, "null"]
          format: date-time
        executedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        isExpired:
          type: boolean
      required: [id, tool, params, summary, status, expiresAt, createdAt]

    AiChatResponse:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        message:
          type: string
        pendingActions:
          type: array
          items:
            $ref: "#/components/schemas/AiPendingAction"
        tokensUsed:
          type: integer
          minimum: 0
      required: [conversationId, message, pendingActions, tokensUsed]

    AiActionOutcome:
      type: object
      description: State returned immediately after an action is approved, executed, or rejected.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [rejected, executed, failed]
        result:
          type: [object, "null"]
          additionalProperties: true
        error:
          type: [string, "null"]
        message:
          type: string
      required: [id, status]

    AiInsight:
      type: object
      properties:
        type:
          type: string
        category:
          type: string
        title:
          type: string
        value: {}
        href:
          type: string
      required: [type, category, title]

    AiInsightsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AiInsight"
        generatedAt:
          type: string
          format: date-time
      required: [items, generatedAt]

    AiAnomalyDetectionInsight:
      type: object
      properties:
        operation: { type: string, const: anomaly_detection }
        method: { type: string, const: rule_based_thresholds }
        dataWindow: { type: object, additionalProperties: true }
        anomalies: { type: array, items: { type: object, additionalProperties: true } }
        summary: { type: object, additionalProperties: true }
      required: [operation, method, dataWindow, anomalies, summary]

    AiPredictiveInsight:
      type: object
      properties:
        operation: { type: string, const: predictive }
        method: { type: string, const: ordinary_least_squares_daily_sales_trend }
        dataWindow: { type: object, additionalProperties: true }
        projection: { type: object, additionalProperties: true }
        currency: { type: string }
      required: [operation, method, dataWindow, projection, currency]

    AiBusinessIntelligenceInsight:
      type: object
      properties:
        operation: { type: string, const: business_intelligence }
        dataWindow: { type: object, additionalProperties: true }
        sales: { type: object, additionalProperties: true }
        customers: { type: object, additionalProperties: true }
        ordersByStatus: { type: array, items: { type: object, additionalProperties: true } }
        inventory: { type: object, additionalProperties: true }
      required: [operation, dataWindow, sales, customers, ordersByStatus, inventory]

    AiFinanceInsight:
      type: object
      properties:
        operation: { type: string, const: finance_advanced }
        method: { type: string, const: invoice_balance_aggregation }
        receivables: { type: object, additionalProperties: true }
        invoicesByStatus: { type: array, items: { type: object, additionalProperties: true } }
        currencies: { type: array, items: { type: string } }
      required: [operation, method, receivables, invoicesByStatus, currencies]

    AiFactoryInsight:
      type: object
      properties:
        operation: { type: string, const: factory }
        dataWindow: { type: object, additionalProperties: true }
        production: { type: object, additionalProperties: true }
        planning: { type: object, additionalProperties: true }
        inventoryMovements: { type: object, additionalProperties: true }
      required: [operation, dataWindow, production, planning, inventoryMovements]

    AiAnomalyDetectionResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AiAnomalyDetectionInsight" }
      required: [data]

    AiPredictiveResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AiPredictiveInsight" }
      required: [data]

    AiBusinessIntelligenceResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AiBusinessIntelligenceInsight" }
      required: [data]

    AiFinanceInsightResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AiFinanceInsight" }
      required: [data]

    AiFactoryInsightResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AiFactoryInsight" }
      required: [data]

    AiConversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [seller, buyer, superadmin]
        locale:
          type: string
          enum: [en, ar, ku]
        totalTokensUsed:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, role, locale, totalTokensUsed, createdAt, updatedAt]

    AuthTokens:
      type: object
      description: The access token is returned in JSON and an HttpOnly access_token cookie. The refresh token is only delivered and rotated in the HttpOnly refresh_token cookie; it is never returned in a response body and must never be sent as a bearer credential.
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Access token TTL in seconds
      required:
        - accessToken
        - tokenType
        - expiresIn

    RegisterCompanyRequest:
      type: object
      properties:
        termsAccepted:
          type: boolean
          const: true
          description: Must be true after the user has read the currently published Terms.
        termsDocumentId:
          type: string
          format: uuid
          description: ID of the published Terms document the user accepted.
        termsDocumentVersion:
          type: string
          minLength: 1
          maxLength: 50
          description: Exact version of the published Terms document the user accepted.
        company:
          type: object
          properties:
            nameEn:
              type: string
              minLength: 2
            nameAr:
              type: string
            nameKu:
              type: string
            phone:
              type: string
              description: E.164 format, default +964 (Iraq)
            email:
              type: string
              format: email
          required:
            - nameEn
        user:
          type: object
          properties:
            firstName:
              type: string
              minLength: 1
            lastName:
              type: string
              minLength: 1
            email:
              type: string
              format: email
            phone:
              type: string
            position:
              type: string
              minLength: 1
            password:
              type: string
              minLength: 8
          required:
            - firstName
            - lastName
            - position
            - password
      required:
        - company
        - user
        - termsAccepted
        - termsDocumentId
        - termsDocumentVersion

    LegalDocumentContent:
      type: object
      required: [id, documentType, version, title, content, effectiveAt, publishedAt, language, requestedLanguage, fallbackLanguage]
      properties:
        id:
          type: string
          format: uuid
        documentType:
          type: string
          enum: [terms_and_conditions, privacy_policy, seller_agreement, buyer_terms, marketplace_terms, commission_agreement, advertising_agreement, return_policy, payment_terms, about_linqi, other]
        version:
          type: string
        title:
          type: string
        content:
          type: string
        effectiveAt:
          type: [string, "null"]
          format: date-time
        publishedAt:
          type: [string, "null"]
          format: date-time
        language:
          type: string
          enum: [en, ar, ku]
        requestedLanguage:
          type: string
          enum: [en, ar, ku]
        fallbackLanguage:
          type: [string, "null"]
          enum: [en, ar, ku, null]

    LegalDocumentContentResponse:
      type: object
      required: [document]
      properties:
        document:
          $ref: "#/components/schemas/LegalDocumentContent"

    LegalDocumentSection:
      type: object
      required: [sectionKey, displayOrder, title, content, language]
      properties:
        sectionKey: { type: string }
        displayOrder: { type: integer }
        title: { type: string }
        content: { type: string }
        language: { type: string, enum: [en, ar, ku] }

    LegalDocumentSectionsResponse:
      type: object
      required: [documentId, documentType, version, requestedLanguage, language, fallbackLanguage, sections]
      properties:
        documentId: { type: string, format: uuid }
        documentType:
          type: string
          enum: [terms_and_conditions, privacy_policy, seller_agreement, buyer_terms, marketplace_terms, commission_agreement, advertising_agreement, return_policy, payment_terms, about_linqi, other]
        version: { type: string }
        requestedLanguage: { type: string, enum: [en, ar, ku] }
        language: { type: string, enum: [en, ar, ku] }
        fallbackLanguage: { type: [string, "null"], enum: [en, ar, ku, null] }
        sections:
          type: array
          items: { $ref: "#/components/schemas/LegalDocumentSection" }

    LocalizedFaq:
      type: object
      required: [id, category, title, content, sortOrder, language, requestedLanguage, fallbackLanguage]
      properties:
        id: { type: string, format: uuid }
        category: { type: string }
        title: { type: string }
        content: { type: string }
        sortOrder: { type: integer, minimum: 0 }
        language: { type: string, enum: [en, ar, ku] }
        requestedLanguage: { type: string, enum: [en, ar, ku] }
        fallbackLanguage: { type: [string, "null"], enum: [en, ar, ku, null] }

    PublicFaqListResponse:
      type: object
      required: [requestedLanguage, faqs]
      properties:
        requestedLanguage: { type: string, enum: [en, ar, ku] }
        faqs:
          type: array
          items: { $ref: "#/components/schemas/LocalizedFaq" }

    PublicFaqResponse:
      type: object
      required: [faq]
      properties:
        faq: { $ref: "#/components/schemas/LocalizedFaq" }

    SuperAdminFaqWriteRequest:
      type: object
      required: [category, titleEn, titleAr, titleKu, contentEn, contentAr, contentKu]
      properties:
        category: { type: string, minLength: 1, maxLength: 100 }
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, minLength: 1, maxLength: 500 }
        titleKu: { type: string, minLength: 1, maxLength: 500 }
        contentEn: { type: string, minLength: 1 }
        contentAr: { type: string, minLength: 1 }
        contentKu: { type: string, minLength: 1 }
        sortOrder: { type: integer, minimum: 0, default: 0 }

    SuperAdminFaqUpdateRequest:
      type: object
      minProperties: 1
      properties:
        category: { type: string, minLength: 1, maxLength: 100 }
        titleEn: { type: string, minLength: 1, maxLength: 500 }
        titleAr: { type: string, minLength: 1, maxLength: 500 }
        titleKu: { type: string, minLength: 1, maxLength: 500 }
        contentEn: { type: string, minLength: 1 }
        contentAr: { type: string, minLength: 1 }
        contentKu: { type: string, minLength: 1 }
        sortOrder: { type: integer, minimum: 0 }

    SuperAdminFaq:
      allOf:
        - $ref: "#/components/schemas/SuperAdminFaqWriteRequest"
        - type: object
          required: [id, status, sortOrder, publishedAt, createdAt, updatedAt]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, published] }
            sortOrder: { type: integer, minimum: 0 }
            publishedAt: { type: [string, "null"], format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    SuperAdminFaqResponse:
      type: object
      required: [article]
      properties:
        article: { $ref: "#/components/schemas/SuperAdminFaq" }

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nameEn:
          type: string
        nameAr:
          type: string
        nameKu:
          type: string
        tradeName:
          type: string
        registrationNumber:
          type: string
        phone:
          type: [string, "null"]
        email:
          type: string
        website:
          type: string
        verificationStatus:
          type: string
          enum: [pending_verification, verified, suspended, rejected]
        primaryAdminUserId:
          type: string
          format: uuid
        successionStatus:
          type: string
          enum: [none, nominated, linqi_review, approved]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - nameEn
        - verificationStatus
        - successionStatus
        - createdAt
        - updatedAt

    UpdateCompanyRequest:
      type: object
      properties:
        nameEn:
          type: string
        nameAr:
          type: string
        nameKu:
          type: string
        tradeName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        website:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        email:
          type: string
        phone:
          type: [string, "null"]
        firstName:
          type: string
        lastName:
          type: string
        position:
          type: string
        status:
          type: string
          enum: [active, deactivated, suspended]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - firstName
        - lastName
        - position
        - status
        - createdAt

    InviteUserRequest:
      type: object
      properties:
        contactMethod:
          type: string
          enum: [email, phone]
        contactValue:
          type: string
        intendedRoleId:
          type: string
          format: uuid
      required:
        - contactMethod
        - contactValue

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        invitedByUserId:
          type: string
          format: uuid
        contactMethod:
          type: string
          enum: [email, phone]
        contactValue:
          type: string
        status:
          type: string
          enum: [pending, accepted, rejected, cancelled, expired, otp_blocked]
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - invitedByUserId
        - contactMethod
        - contactValue
        - status
        - expiresAt
        - createdAt

    VerifyOtpRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 6
          maxLength: 6
        firstName:
          type: string
        lastName:
          type: string
        password:
          type: string
          minLength: 8
        position:
          type: string
      required:
        - otp
        - firstName
        - lastName
        - password
        - position

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        nameEn:
          type: string
        nameAr:
          type: string
        nameKu:
          type: string
        descriptionEn:
          type: string
        type:
          type: string
          enum: [standard, custom]
        isCompanyAdminRole:
          type: boolean
        isSystemRole:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - nameEn
        - type
        - isCompanyAdminRole
        - isSystemRole
        - createdAt

    CreateRoleRequest:
      type: object
      properties:
        nameEn:
          type: string
          minLength: 1
        nameAr:
          type: string
        nameKu:
          type: string
        descriptionEn:
          type: string
      required:
        - nameEn

    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        module:
          type: string
        feature:
          type: string
        action:
          type: string
        descriptionEn:
          type: string
        descriptionAr:
          type: string
        descriptionKu:
          type: string
      required:
        - id
        - module
        - feature
        - action

    SetRolePermissionsRequest:
      type: object
      properties:
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - permissionIds

    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actorType:
          type: string
          enum: [company_user, super_admin]
        actorId:
          type: string
          format: uuid
        actorDisplayName:
          type: string
        companyId:
          type: string
          format: uuid
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
          format: uuid
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - actorType
        - actorId
        - actorDisplayName
        - action
        - createdAt

    SuperAdmin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [active, deactivated]
      required:
        - id
        - email
        - firstName
        - lastName
        - status

    NominateSuccessorRequest:
      type: object
      properties:
        nominatedUserId:
          type: string
          format: uuid
      required:
        - nominatedUserId

    UpdateCompanyStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [pending_verification, verified, suspended, rejected]
        reason:
          type: string
      required:
        - status

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - data
        - total

    MarketplaceCatalog:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        slug: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        nameKu: { type: string }
        descriptionEn: { type: string }
        descriptionAr: { type: string }
        descriptionKu: { type: string }
        iconName: { type: [string, "null"] }
        imageKey: { type: [string, "null"] }
        displayOrder: { type: integer }
        status: { type: string, enum: [active, inactive] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, code, slug, nameEn, nameAr, nameKu, descriptionEn, descriptionAr, descriptionKu, iconName, imageKey, displayOrder, status, createdAt, updatedAt]

    MarketplaceCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        catalogId: { type: [string, "null"], format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        code: { type: string }
        slug: { type: string }
        nameEn: { type: string }
        nameAr: { type: string }
        nameKu: { type: string }
        descriptionEn: { type: [string, "null"] }
        descriptionAr: { type: [string, "null"] }
        descriptionKu: { type: [string, "null"] }
        level: { type: integer }
        displayOrder: { type: integer }
        iconName: { type: [string, "null"] }
