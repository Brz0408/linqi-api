  /companies/{companyId}/ai/actions/{actionId}/approve:
    post:
      operationId: approveCompanyAiAction
      tags: [ai]
      summary: Approve and execute a pending AI action
      description: Requires an authenticated seller with approval permission. The server atomically transitions only a non-expired pending action owned by the requested company.
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: actionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Action approval and execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: "#/components/schemas/AiActionOutcome"
                required: [action]
        "401":
          description: Authentication is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Seller approval permission, subscription, or capability is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiEntitlementError" }
        "409":
          description: The action has expired or already reached a final state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiActionConflictError" }

  /companies/{companyId}/ai/actions/{actionId}/reject:
    post:
      operationId: rejectCompanyAiAction
      tags: [ai]
      summary: Reject a pending AI action
      description: Requires an authenticated seller with approval permission. Rejection is permitted only while the company-owned action remains pending.
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: actionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rejected action
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    $ref: "#/components/schemas/AiActionOutcome"
                required: [action]
        "401":
          description: Authentication is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Seller approval permission, subscription, or capability is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiEntitlementError" }
        "409":
          description: The action has already reached a final state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiActionConflictError" }

  /companies/{companyId}/ai/conversations:
    get:
      operationId: listCompanyAiConversations
