        "400": { description: Invalid provider configuration, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: Credential encryption unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /superadmin/subscription-billing/payment-methods/{provider}/test:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [qicard, fib] } }]
    post:
