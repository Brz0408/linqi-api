          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthTokens"
                  - type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      company:
                        $ref: "#/components/schemas/Company"
        "401":
          description: Invalid credentials or inactive account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logoutCompanyUser
      tags: [auth]
      summary: Revoke refresh token and clear session
      responses:
        "204":
          description: Logged out

  /auth/refresh:
    post:
      operationId: refreshCompanyUserToken
      tags: [auth]
      summary: Rotate the HttpOnly refresh cookie and get a new access token
      description: |
        Call with `credentials: "include"` and no Authorization header. The refresh token is accepted only from the HttpOnly refresh_token cookie, is atomically rotated where the database supports transactions, and is never returned in JSON. On an access-token expiry during a multipart catalog upload, call this endpoint with credentials and then replay the original multipart request exactly once. Do not use a refresh token as a bearer token on this or any business route.
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/otp/verify:
    post:
      operationId: verifyInvitationOtp
      tags: [auth]
      security: []
      summary: Verify OTP for an invitation and create user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    invitationId:
                      type: string
                      format: uuid
                  required:
                    - invitationId
                - $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: OTP verified, user account created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthTokens"
                  - type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          description: Invalid OTP, expired, or blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/otp/resend:
    post:
      operationId: resendInvitationOtp
      tags: [auth]
      security: []
      summary: Resend OTP for an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitationId:
                  type: string
                  format: uuid
              required:
                - invitationId
      responses:
        "200":
          description: OTP resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Cannot resend — invitation expired, cancelled, or blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ── Super Admin Auth ───────────────────────────────────────────────────────

  /auth/superadmin/login:
