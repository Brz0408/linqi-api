      responses:
        "200": { description: Provider configurations without secrets, content: { application/json: { schema: { $ref: "#/components/schemas/BillingProviderResponse" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /superadmin/subscription-billing/payment-methods/{provider}:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string, enum: [qicard, fib] } }]
    put:
      operationId: updateSubscriptionPaymentMethod
      tags: [superadmin-subscription-billing]
      x-permission: subscriptions.manage
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled, environment], properties: { enabled: { type: boolean }, environment: { type: string, enum: [sandbox, production] }, settings: { type: object, additionalProperties: false }, credentials: { type: object, additionalProperties: { type: string } } } } } } }
