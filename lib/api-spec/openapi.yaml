        "403":
          description: Subscription plan mutations disabled
          content: { application/json: { schema: { $ref: "#/components/schemas/CanonicalSubscriptionMutationError" } } }
  /superadmin/companies/{companyId}/subscription-plan:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSuperadminCompaniesCompanyIdSubscriptionPlan
      tags: [superadmin]
      summary: Get a company's administrative plan assignment
      responses:
        "200":
          description: Administrative assignment and effective canonical matrix
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperAdminCompanySubscriptionResponse" }
        "401":
          description: Authentication required
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Super Admin permission denied
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: Company not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    post:
      operationId: postSuperadminCompaniesCompanyIdSubscriptionPlan
      tags: [superadmin]
      summary: Administratively assign a canonical plan; this is not payment confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [planId]
              properties:
                planId: { type: string, format: uuid }
      responses:
        "201":
          description: "Administrative assignment, not a provider payment"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionAdministrativeResponse" }
        "400":
          description: "Invalid body, including payment/provider fields"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Super Admin permission denied
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: Company or active plan not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: Concurrent assignment conflict
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422":
          description: Non-canonical plan
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /superadmin/companies/{companyId}/subscription-plan/expire:
    parameters:
      - name: companyId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: postSuperadminCompaniesCompanyIdSubscriptionPlanExpire
      tags: [superadmin]
      summary: Administratively expire an active canonical subscription without recording payment
      description: This revokes an administrative assignment. It does not create a manual payment reference, a provider payment, a QiCard payment, or a FIB payment.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpireSubscriptionRequest" }
      responses:
        "200":
          description: Administrative expiration, never provider payment confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionAdministrativeResponse" }
        "400":
          description: Invalid strict expiration body
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403":
          description: Super Admin permission denied
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "404":
          description: Company or active subscription not found
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "409":
          description: Subscription is already expired or changed concurrently
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  /companies/{companyId}/subscription-plan:
    parameters:
      - name: companyId
        in: path
