  # ── Marketplace taxonomy ───────────────────────────────────────────────────
  /marketplace/catalogs:
    get:
      operationId: listMarketplaceCatalogs
      tags: [marketplace]
      security: []
      summary: List active marketplace catalogs with their public category trees
      responses:
        "200":
          description: Active catalogs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MarketplaceCatalogWithTree" }
                  total: { type: integer }
                required: [data, total]
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /marketplace/catalogs/{catalogId}:
    get:
      operationId: getMarketplaceCatalog
      tags: [marketplace]
      security: []
      summary: Get an active marketplace catalog and its public category tree
      parameters:
        - name: catalogId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceCatalogWithTree" }
        "404":
          description: Catalog not found or inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /marketplace/categories:
    get:
      operationId: listMarketplaceCategories
      tags: [marketplace]
      security: []
      summary: List public marketplace categories and the complete filtered tree
      parameters:
        - name: parent_id
          in: query
          description: Filter direct children; use `root` for root categories.
          schema: { type: string }
        - name: catalogId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public categories and category tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MarketplaceCategoryWithProductCount" }
                  total: { type: integer }
                  tree:
                    type: array
                    items: { $ref: "#/components/schemas/MarketplaceCategoryTreeNode" }
                required: [data, total, tree]

  /marketplace/categories/{categoryId}:
    get:
      operationId: getMarketplaceCategory
      tags: [marketplace]
      security: []
      summary: Get a public marketplace category and its descendants
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public category
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MarketplaceCategoryWithProductCount"
                  - type: object
                    properties:
                      children:
                        type: array
                        items: { $ref: "#/components/schemas/MarketplaceCategoryTreeNode" }
                    required: [children]
        "404":
          description: Category not found or inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /marketplace/categories/{categoryId}/product-types:
    get:
      operationId: listMarketplaceProductTypes
      tags: [marketplace]
      security: []
      summary: List active product types for a public active category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active product types ordered by displayOrder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceProductTypeListResponse" }
        "404":
          description: Category not found or inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /marketplace/product-types/{productTypeId}:
    get:
      operationId: getMarketplaceProductType
      tags: [marketplace]
      security: []
      summary: Get an active product type in a public active category
      parameters:
        - name: productTypeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Active product type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceProductType" }
        "404":
          description: Product type not found, inactive, or belongs to an inactive category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /marketplace/product-types/{productTypeId}/attributes:
    get:
      operationId: listMarketplaceProductTypeAttributes
      tags: [marketplace]
      security: []
      summary: List attribute assignments and active select options for a public product type
      parameters:
        - name: productTypeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Attribute assignments ordered by displayOrder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceProductTypeAttributeListResponse" }
        "404":
          description: Product type not found, inactive, or belongs to an inactive category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "500":
          description: Server error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /superadmin/marketplace/product-types:
    get:
      operationId: superAdminListMarketplaceProductTypes
      tags: [superadmin, marketplace]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      summary: List all marketplace product types for Super Admin management
      parameters:
        - name: categoryId
          in: query
          description: Optionally restrict the list to one category.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product types, including inactive rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuperAdminMarketplaceProductTypeListResponse" }
        "401": { description: Super Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: products.view permission required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: superAdminCreateMarketplaceProductType
      tags: [superadmin, marketplace]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      summary: Create a marketplace product type
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceProductTypeWriteRequest" }
      responses:
        "201": { description: Product type created, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceProductType" } } } }
        "400": { description: Validation error or category not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Super Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: products.manage permission required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Inactive category or duplicate code or slug, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/product-types/{productTypeId}:
    patch:
      operationId: superAdminUpdateMarketplaceProductType
      tags: [superadmin, marketplace]
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      summary: Update a marketplace product type
      parameters:
        - name: productTypeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceProductTypeUpdateRequest" }
      responses:
        "200": { description: Product type updated, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceProductType" } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Super Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: products.manage permission required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Product type not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Duplicate code or slug, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/catalogs:
    get:
      operationId: superAdminListMarketplaceCatalogs
      tags: [superadmin, marketplace]
      summary: List marketplace catalogs for Super Admin management
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
      responses:
        "200":
          description: Marketplace catalogs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/MarketplaceCatalog"
                        - type: object
                          properties: { categoryCount: { type: integer } }
                          required: [categoryCount]
                required: [data]
    post:
      operationId: superAdminCreateMarketplaceCatalog
      tags: [superadmin, marketplace]
      summary: Create a marketplace catalog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCatalogRequest" }
      responses:
        "201":
          description: Catalog created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketplaceCatalog" }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Duplicate catalog code or slug, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/catalogs/reconcile-canonical:
    post:
      operationId: superAdminReconcileCanonicalMarketplaceCatalogs
      tags: [superadmin, marketplace]
      summary: Reconcile historical marketplace catalog assignments to canonical catalogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean, enum: [true] }
              required: [confirm]
              additionalProperties: false
      responses:
        "200":
          description: Reconciliation applied or already complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      insertedCanonicalCatalogs: { type: array, items: { type: string } }
                      movedBranches: { type: array, items: { type: string } }
                      detachedBranches: { type: array, items: { type: string } }
                      skippedBranches:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string }
                            reason:
                              type: string
                              enum: [manual_conflicting_catalog_assignment]
                          required: [code, reason]
                          additionalProperties: false
                      archivedLegacyCatalogs: { type: array, items: { type: string } }
                      finalActiveCanonicalCount: { type: integer }
                    required: [insertedCanonicalCatalogs, movedBranches, detachedBranches, skippedBranches, archivedLegacyCatalogs, finalActiveCanonicalCount]
                required: [data]
        "400": { description: Explicit confirmation is required }
        "401": { description: Super Admin authentication required }
        "403": { description: products.manage permission required }
        "409":
          description: Existing operator data conflicts with a canonical catalog identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code:
                    type: string
                    enum: [CANONICAL_CATALOG_IDENTITY_CONFLICT]
                  details:
                    type: object
                    properties:
                      conflictingCatalogCodes:
                        type: array
                        items: { type: string }
                    required: [conflictingCatalogCodes]
                    additionalProperties: false
                required: [error, code, details]
                additionalProperties: false

  /superadmin/marketplace/catalogs/{id}:
    patch:
      operationId: superAdminUpdateMarketplaceCatalog
      tags: [superadmin, marketplace]
      summary: Update a marketplace catalog
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCatalogUpdateRequest" }
      responses:
        "200": { description: Catalog updated, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceCatalog" } } } }
        "404": { description: Catalog not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Duplicate catalog code or slug, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: superAdminDeleteMarketplaceCatalog
      tags: [superadmin, marketplace]
      summary: Delete an empty marketplace catalog
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Catalog deleted, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceCatalog" } } } }
        "404": { description: Catalog not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Catalog has categories, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/catalogs/reorder:
    put:
      operationId: superAdminReorderMarketplaceCatalogs
      tags: [superadmin, marketplace]
      summary: Reorder the complete marketplace catalog set
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCatalogReorderRequest" }
      responses:
        "200":
          description: Catalog order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: string, format: uuid } }
                required: [data]
        "409": { description: Supplied IDs do not match the catalog set, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/catalogs/{id}/status:
    patch:
      operationId: superAdminUpdateMarketplaceCatalogStatus
      tags: [superadmin, marketplace]
