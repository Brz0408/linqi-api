        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        provider: { type: string, enum: [generic_https] }
        name: { type: string }
        status: { type: string, enum: [configuration_required, testing, connected, error, suspended] }
        config: { type: object, additionalProperties: true, description: Redacted configuration. }
        lastTestedAt: { type: [string, "null"], format: date-time }
        lastConnectedAt: { type: [string, "null"], format: date-time }
        lastErrorCode: { type: [string, "null"] }
        lastErrorAt: { type: [string, "null"], format: date-time }
        suspendedAt: { type: [string, "null"], format: date-time }
        suspendedReason: { type: [string, "null"] }
        createdByUserId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, companyId, provider, name, status, config, lastTestedAt, lastConnectedAt, lastErrorCode, lastErrorAt, suspendedAt, suspendedReason, createdByUserId, createdAt, updatedAt]
    GenericHttpsIntegrationConfig:
      type: object
      additionalProperties: false
      description: Safe configuration for the generic_https provider.
      properties:
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 30000
        syncPath:
          type: string
          maxLength: 512
          pattern: "^/(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))[A-Za-z0-9._~!$&'()*+,;=:@%/-]*$"
          description: Safe relative path beginning with exactly one slash and containing no parent-directory segment.
    IntegrationWebhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        integrationId: { type: string, format: uuid }
        url: { type: string, format: uri }
        eventTypes:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            enum: [integration.connected, integration.sync.completed, integration.sync.failed, integration.sync.dead_letter]
        isActive: { type: boolean }
        lastTestedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, companyId, integrationId, url, eventTypes, isActive, lastTestedAt, createdAt, updatedAt]
    IntegrationSyncJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        integrationId: { type: string, format: uuid }
        status: { type: string }
        attempts: { type: integer }
        maxAttempts: { type: integer }
        lastErrorCode: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, companyId, integrationId, status, attempts, maxAttempts, lastErrorCode, createdAt]
    IntegrationPolicy:
      type: object
      properties:
        id: { type: string, format: uuid }
        maxIntegrationsPerCompany: { type: integer, minimum: 1, maximum: 100 }
        maxWebhooksPerIntegration: { type: integer, minimum: 1, maximum: 100 }
        allowedCategories: { type: array, minItems: 1, items: { type: string, enum: [generic_https] } }
        updatedAt: { type: string, format: date-time }
      required: [maxIntegrationsPerCompany, maxWebhooksPerIntegration, allowedCategories]
    CreateSellerIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        category: { type: string, enum: [generic_https], default: generic_https }
      required: [name]
    UpdateSellerIntegrationRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        endpointUrl: { type: string, format: uri, maxLength: 2048 }
        apiKey: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
        webhookSecret: { type: string, minLength: 16, maxLength: 4096, writeOnly: true }
        config: { $ref: "#/components/schemas/GenericHttpsIntegrationConfig" }
      required: [endpointUrl]
    SellerIntegrationWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        eventTypes:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            enum: [integration.connected, integration.sync.completed, integration.sync.failed, integration.sync.dead_letter]
        signingSecret: { type: string, minLength: 16, maxLength: 4096, writeOnly: true }
        isActive: { type: boolean }
      required: [url, eventTypes]
    UpdateIntegrationPolicyRequest:
      type: object
      additionalProperties: false
      properties:
        maxIntegrationsPerCompany: { type: integer, minimum: 1, maximum: 100 }
        maxWebhooksPerIntegration: { type: integer, minimum: 1, maximum: 100 }
        allowedCategories: { type: array, minItems: 1, maxItems: 10, items: { type: string, enum: [generic_https] } }
    IntegrationError:
      type: object
      properties: { error: { type: string }, message: { type: string }, details: {} }
      required: [error]
    BillingPlansResponse:
      type: object
      additionalProperties: false
      required: [plans]
      properties: { plans: { type: array, items: { $ref: "#/components/schemas/BillingPlan" } } }
    BillingPricesResponse:
      type: object
      additionalProperties: false
      required: [prices]
      properties: { prices: { type: array, items: { $ref: "#/components/schemas/BillingPrice" } } }
    BillingProviderTestResponse:
      type: object
      additionalProperties: false
      required: [provider, status]
      properties:
        provider: { type: string, enum: [qicard, fib] }
        status: { type: string }
        message: { type: string }

security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /companies/{companyId}/subscription-payment-options:
    get:
      operationId: getCompanySubscriptionPaymentOptions
      tags: [subscription-payments]
      security: [{ bearerAuth: [] }]
      summary: Get server-calculated subscription payment options for a company
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Current plan, eligible upgrades, official amounts, and eligible payment methods", content: { application/json: { schema: { $ref: "#/components/schemas/CompanySubscriptionPaymentOptionsResponse" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Subscription payment access denied, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "500": { description: Subscription options could not be calculated because active subscription data is invalid, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentOptionsError" } } } }
        "503": { description: Canonical plans or subscription payment configuration are temporarily unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentOptionsError" } } } }
  /companies/{companyId}/subscription-payment-submissions:
    get:
      operationId: listSubscriptionPaymentSubmissions
      tags: [subscription-payments]
      security: [{ bearerAuth: [] }]
      summary: List a Seller company's payment submissions
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionStatus" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Seller company payment submissions, content: { application/json: { schema: { type: object, additionalProperties: false, required: [submissions, total, page, pageSize], properties: { submissions: { type: array, items: { $ref: "#/components/schemas/SubscriptionPaymentSubmission" } }, total: { type: integer, minimum: 0 }, page: { type: integer, minimum: 1 }, pageSize: { type: integer, minimum: 1 } } } } } }
        "400": { description: Invalid list filters or pagination, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
    post:
      operationId: createSubscriptionPaymentSubmission
      tags: [subscription-payments]
      security: [{ bearerAuth: [] }]
      summary: Create an idempotent pending subscription payment submission with transfer proof
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSubscriptionPaymentSubmissionRequest" } } }
      responses:
        "200": { description: Existing payment submission returned for the same company idempotency key, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmission" } } } }
        "201": { description: Created pending payment submission, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmission" } } } }
        "400": { description: Invalid strict request body, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Upgrade or payment method is not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "409": { description: Existing submission has a conflicting state, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
        "422": { description: Requested plan transition or payment method is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
  /companies/{companyId}/subscription-payment-submissions/{id}:
    parameters:
      - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSubscriptionPaymentSubmission
      tags: [subscription-payments]
      security: [{ bearerAuth: [] }]
      summary: Get a payment submission belonging to the authenticated Seller company
      responses:
        "200": { description: Payment submission, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmission" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "404": { description: Submission not found in the authenticated company, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
  /companies/{companyId}/subscription-payment-submissions/{id}/cancel:
    post:
      operationId: cancelSubscriptionPaymentSubmission
      tags: [subscription-payments]
      security: [{ bearerAuth: [] }]
      summary: Cancel a non-approved subscription payment submission
      parameters:
        - { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Cancelled payment submission, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmission" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "404": { description: Submission not found in the authenticated company, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
        "409": { description: An approved or final submission cannot be cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
  /superadmin/finance/subscription-offers:
    get:
      operationId: listSuperadminSubscriptionOffers
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Subscription commercial offers, content: { application/json: { schema: { type: object, additionalProperties: false, required: [offers], properties: { offers: { type: array, items: { $ref: "#/components/schemas/SubscriptionOffer" } } } } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Financial permission required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
    post:
      operationId: createSuperadminSubscriptionOffer
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateSubscriptionOfferRequest" } } } }
      responses:
        "201": { description: Created offer, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferResponse" } } } }
        "400": { description: Invalid offer, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Financial permission required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "422": { description: Invalid commercial values, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /superadmin/finance/subscription-offers/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: getSuperadminSubscriptionOffer
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Offer, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferResponse" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Financial permission required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "404": { description: Offer not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    patch:
      operationId: patchSuperadminSubscriptionOffer
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatchSubscriptionOfferRequest" } } } }
      responses:
        "200": { description: Updated offer, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferResponse" } } } }
        "400": { description: Invalid offer, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Financial permission required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "409": { description: Version conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Invalid commercial values, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: archiveSuperadminSubscriptionOffer
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferStateRequest" } } } }
      responses:
        "200": { description: Archived offer, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferResponse" } } } }
        "400": { description: Missing expected version }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
        "409": { description: Version or state conflict }
  /superadmin/finance/subscription-offers/{id}/publish:
    post:
      operationId: publishSuperadminSubscriptionOffer
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferStateRequest" } } } }
      responses:
        "200": { description: Published offer, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferResponse" } } } }
        "400": { description: Missing expected version }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
        "409": { description: Version or state conflict }
        "422": { description: Offer is not publishable }
  /superadmin/finance/subscription-offers/{id}/unpublish:
    post:
      operationId: unpublishSuperadminSubscriptionOffer
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferStateRequest" } } } }
      responses:
        "200": { description: Unpublished offer, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferResponse" } } } }
        "400": { description: Missing expected version }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
        "409": { description: Version or state conflict }
  /superadmin/finance/subscription-payment-methods:
    get:
      operationId: listSuperadminSubscriptionPaymentMethods
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Dedicated subscription payment methods, content: { application/json: { schema: { type: object, required: [paymentMethods], properties: { paymentMethods: { type: array, items: { $ref: "#/components/schemas/SubscriptionPaymentMethodAdmin" } } } } } } }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
  /superadmin/finance/subscription-payment-methods/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodCode" } }]
    get:
      operationId: getSuperadminSubscriptionPaymentMethod
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Payment method, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodAdminResponse" } } } }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
        "404": { description: Payment method not found }
    patch:
      operationId: patchSuperadminSubscriptionPaymentMethod
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatchSubscriptionPaymentMethodRequest" } } } }
      responses:
        "200": { description: Updated payment method, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodAdminResponse" } } } }
        "400": { description: Invalid payment method }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
        "409": { description: Version conflict }
    delete:
      operationId: archiveSuperadminSubscriptionPaymentMethod
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferStateRequest" } } } }
      responses:
        "200": { description: Archived payment method, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodAdminResponse" } } } }
        "400": { description: Missing expected version }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
        "409": { description: Version or state conflict }
  /superadmin/finance/subscription-payment-methods/{code}/publish:
    post:
      operationId: publishSuperadminSubscriptionPaymentMethod
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodCode" } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferStateRequest" } } } }
      responses:
        "200": { description: Published payment method, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodAdminResponse" } } } }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
        "409": { description: Conflict }
        "422": { description: Invalid metadata }
  /superadmin/finance/subscription-payment-methods/{code}/unpublish:
    post:
      operationId: unpublishSuperadminSubscriptionPaymentMethod
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodCode" } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionOfferStateRequest" } } } }
      responses:
        "200": { description: Unpublished payment method, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodAdminResponse" } } } }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Financial permission required }
        "409": { description: Conflict }
  /superadmin/finance/subscription-payment-submissions:
    get:
      operationId: listSuperadminSubscriptionPaymentSubmissions
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      summary: List manual subscription payment submissions for Super Admin review
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionStatus" } }
        - { name: companyId, in: query, schema: { type: string, format: uuid } }
        - { name: paymentMethodCode, in: query, schema: { $ref: "#/components/schemas/SubscriptionPaymentMethodCode" } }
        - { name: requestedPlanCode, in: query, schema: { type: string, enum: [pro, premium] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: reference, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Payment submissions for authorized Super Admin review, content: { application/json: { schema: { type: object, additionalProperties: false, required: [submissions, total, page, pageSize], properties: { submissions: { type: array, items: { $ref: "#/components/schemas/SuperadminSubscriptionPaymentSubmission" } }, total: { type: integer, minimum: 0 }, page: { type: integer, minimum: 1 }, pageSize: { type: integer, minimum: 1 } } } } } }
        "400": { description: Invalid list filters or pagination, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Super Admin financial permission required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
  /superadmin/finance/subscription-payment-submissions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSuperadminSubscriptionPaymentSubmission
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      summary: Get a manual subscription payment submission for Super Admin review
      responses:
        "200": { description: Payment submission, content: { application/json: { schema: { $ref: "#/components/schemas/SuperadminSubscriptionPaymentSubmission" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Super Admin financial permission required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "404": { description: Submission not found, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
  /superadmin/finance/subscription-payment-submissions/{id}/review:
    post:
      operationId: reviewSuperadminSubscriptionPaymentSubmission
      tags: [superadmin, subscription-payments]
      security: [{ bearerAuth: [] }]
      summary: Atomically approve or reject a pending manual subscription payment submission
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ReviewSubscriptionPaymentSubmissionRequest" } } }
      responses:
        "200": { description: "Reviewed payment submission and, when approved, server-activated subscription", content: { application/json: { schema: { $ref: "#/components/schemas/SuperadminSubscriptionPaymentSubmission" } } } }
        "400": { description: Invalid review action or missing rejection reason, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "403": { description: Super Admin financial permission required, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentAuthError" } } } }
        "404": { description: Submission not found, content: { application/json: { schema: { $ref: "#/components/schemas/SubscriptionPaymentSubmissionError" } } } }
