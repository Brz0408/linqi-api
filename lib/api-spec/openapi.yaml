        "200": { description: Provider connection verified by an installed backend adapter, content: { application/json: { schema: { $ref: "#/components/schemas/BillingProviderTestResponse" } } } }
        "501": { description: Provider adapter unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: Provider credentials not configured, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /superadmin/subscription-billing/billing-settings:
    get:
