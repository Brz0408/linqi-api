  /companies/{companyId}/ai/entitlements:
    get:
      operationId: getCompanyAiEntitlements
      tags: [ai]
      summary: Get server-calculated AI entitlements
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Current AI policy decision for the authenticated company
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiEntitlements" }
        "401":
          description: Authentication is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: The requested company is outside the authenticated user's scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiEntitlementError" }

  /companies/{companyId}/ai/chat:
    post:
      operationId: chatWithCompanyAi
      tags: [ai]
      summary: Send a message to the company AI assistant
      description: Requires the server-calculated `assistant` capability. Tools selected during the conversation are allowlisted and independently entitlement-checked by the server.
      parameters:
        - name: companyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiChatRequest" }
      responses:
        "200":
          description: Assistant response and any prepared (not executed) actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiChatResponse" }
        "401":
          description: Authentication is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: Seller access, subscription, or capability is not available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiEntitlementError" }
  /companies/{companyId}/ai/insights:
    get:
      operationId: getCompanyAiInsights
      tags: [ai]
