  /superadmin/subscription-plans:
    get:
      operationId: getSuperadminSubscriptionPlans
      tags: [superadmin]
      summary: List immutable canonical subscription plans
      responses:
        "200":
          description: Canonical plans and their effective entitlement matrix
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items: { $ref: "#/components/schemas/SubscriptionPlan" }
    post:
      operationId: postSuperadminSubscriptionPlans
      tags: [superadmin]
      summary: Disabled in phase 1; custom subscription plans are not supported
      responses:
        "403":
          description: Custom plans disabled
          content: { application/json: { schema: { $ref: "#/components/schemas/CanonicalSubscriptionMutationError" } } }
  /superadmin/subscription-plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSuperadminSubscriptionPlansId
      tags: [superadmin]
      summary: Get a subscription plan with effective canonical entitlements
      responses:
        "200":
          description: Plan
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: "#/components/schemas/SubscriptionPlan" }
        "404":
          description: Plan not found or not canonical
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
    patch:
      operationId: patchSuperadminSubscriptionPlansId
      tags: [superadmin]
      summary: Canonical plans are read-only in phase 1
      responses:
        "403":
          description: Subscription plan mutations disabled
          content: { application/json: { schema: { $ref: "#/components/schemas/CanonicalSubscriptionMutationError" } } }
    delete:
      operationId: deleteSuperadminSubscriptionPlansId
      tags: [superadmin]
      summary: Canonical plans cannot be deactivated in phase 1
