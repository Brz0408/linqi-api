          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceStatusRequest" }
      responses:
        "200": { description: Catalog status updated, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceCatalog" } } } }
        "404": { description: Catalog not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/catalogs/{id}/image:
    post:
      operationId: superAdminUploadMarketplaceCatalogImage
      tags: [superadmin, marketplace]
      summary: Upload a marketplace catalog cover image
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
              required: [image]
      responses:
        "200": { description: Cover image uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/ImageKeyResponse" } } } }
        "400": { description: No image file provided, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Catalog not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "415": { description: Unsupported or mismatched image type, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/categories:
    get:
      operationId: superAdminListMarketplaceCategories
      tags: [superadmin, marketplace]
      summary: List marketplace categories, including inactive categories
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: catalogId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Marketplace categories and complete tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/MarketplaceCategoryWithProductCount" } }
                  tree: { type: array, items: { $ref: "#/components/schemas/MarketplaceCategoryTreeNode" } }
                required: [data, tree]
    post:
      operationId: superAdminCreateMarketplaceCategory
      tags: [superadmin, marketplace]
      summary: Create a marketplace category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCategoryRequest" }
      responses:
        "201": { description: Category created, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceCategory" } } } }
        "400": { description: Validation error or invalid parent/catalog, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "Duplicate code or slug, or hierarchy conflict", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/categories/reorder:
    put:
      operationId: superAdminReorderMarketplaceCategories
      tags: [superadmin, marketplace]
      summary: Reorder all sibling marketplace categories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCategoryReorderRequest" }
      responses:
        "200":
          description: Category sibling order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: string, format: uuid } }
                required: [data]
        "409": { description: Supplied IDs do not match category siblings, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: superAdminReorderMarketplaceCategoriesLegacy
      tags: [superadmin, marketplace]
      summary: Reorder all sibling marketplace categories
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCategoryReorderRequest" }
      responses:
        "200":
          description: Category sibling order updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { type: string, format: uuid } }
                required: [data]
        "409": { description: Supplied IDs do not match category siblings, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/categories/{id}:
    patch:
      operationId: superAdminUpdateMarketplaceCategory
      tags: [superadmin, marketplace]
      summary: Update or move a marketplace category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceCategoryUpdateRequest" }
      responses:
        "200": { description: Category updated, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceCategory" } } } }
        "400": { description: Validation error or invalid parent/catalog, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Category not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "Duplicate code or slug, or hierarchy conflict", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: superAdminDeleteMarketplaceCategory
      tags: [superadmin, marketplace]
      summary: Delete an unused leaf marketplace category
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Category deleted, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceCategory" } } } }
        "404": { description: Category not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Category is not unused leaf, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/categories/{id}/status:
    patch:
      operationId: superAdminUpdateMarketplaceCategoryStatus
      tags: [superadmin, marketplace]
      summary: Set marketplace category active status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketplaceStatusRequest" }
      responses:
        "200": { description: Category status updated, content: { application/json: { schema: { $ref: "#/components/schemas/MarketplaceCategory" } } } }
        "404": { description: Category not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Category cannot be activated, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/marketplace/categories/{id}/image:
    post:
      operationId: superAdminUploadMarketplaceCategoryImage
      tags: [superadmin, marketplace]
      summary: Upload a marketplace category cover image
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
              required: [image]
      responses:
        "200": { description: Cover image uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/ImageKeyResponse" } } } }
        "400": { description: No image file provided, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Category not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "415": { description: Unsupported or mismatched image type, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/catalog-imports/sellers:
    get:
      operationId: listSuperAdminCatalogImportSellers
      tags: [superadmin, catalog-imports]
      summary: List seller companies eligible for Super Admin catalog work
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Eligible sellers, content: { application/json: { schema: { type: object, properties: { sellers: { type: array, items: { $ref: "#/components/schemas/Company" } } }, required: [sellers] } } } }
        "403": { description: Super Admin permission required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/catalog-imports/{companyId}/jobs:
    get:
      operationId: listSuperAdminCatalogImportJobs
      tags: [superadmin, catalog-imports]
      summary: List a seller's catalog import jobs for Super Admin review
      parameters:
        - &saImportCompanyId { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Seller-owned import jobs, content: { application/json: { schema: { type: object, properties: { jobs: { type: array, items: { $ref: "#/components/schemas/CatalogImportJob" } } }, required: [jobs] } } } }
        "403": { description: Super Admin permission required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/catalog-imports/{companyId}/upload:
    post:
      operationId: createSuperAdminCatalogImport
      tags: [superadmin, catalog-imports]
      summary: Upload a catalog source for a seller
      description: The Super Admin is audited as actor; the job and resulting products remain owned by the seller company. Background parsing starts automatically.
      parameters: [*saImportCompanyId]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary, description: PDF, XLSX, or CSV; maximum 50 MiB. } }
              required: [file]
      responses:
        "201": { description: Seller-owned import job created, content: { application/json: { schema: { type: object, properties: { job: { $ref: "#/components/schemas/CatalogImportJob" } }, required: [job] } } } }
        "400": { description: Invalid or missing source file, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Seller is not marketplace-enabled, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/catalog-imports/{companyId}/jobs/{jobId}/products:
    get:
      operationId: listSuperAdminCatalogImportRows
      tags: [superadmin, catalog-imports]
      summary: List seller staging rows for Super Admin review
      parameters:
        - *saImportCompanyId
        - &saImportJobId { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Staging rows, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/CatalogImportRow" } } }, required: [data] } } } }

  /superadmin/catalog-imports/{companyId}/jobs/{jobId}/products/{rowId}:
    patch:
      operationId: reviewSuperAdminCatalogImportRow
      tags: [superadmin, catalog-imports]
      summary: Review and correct a seller staging row
      description: Approval requires explicit marketplaceCategoryId and marketplaceProductTypeId, a name, positive price, and a strictly positive integer MOQ.
      parameters:
        - *saImportCompanyId
        - *saImportJobId
        - &saImportRowId { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [approve, dismiss] }
                nameEn: { type: [string, "null"] }
                suggestedCategoryId: { type: [string, "null"], format: uuid }
                marketplaceCategoryId: { type: [string, "null"], format: uuid }
                marketplaceProductTypeId: { type: [string, "null"], format: uuid }
                sellerUnitPrice: { type: string, pattern: "^(?:0*[1-9]\\d*)(?:\\.\\d{1,3})?$" }
                sellerMoq: { type: string, pattern: "^[1-9]\\d*$", description: Strictly positive integer. }
                sellerCurrency: { type: string, minLength: 3, maxLength: 3 }
              required: [action]
      responses:
        "200": { description: Reviewed staging row, content: { application/json: { schema: { type: object, properties: { product: { $ref: "#/components/schemas/CatalogImportRow" } }, required: [product] } } } }
        "422": { description: Required review data or marketplace mapping is invalid, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/catalog-imports/{companyId}/jobs/{jobId}/products/{rowId}/draft:
    post:
      operationId: createSuperAdminCatalogImportDraft
      tags: [superadmin, catalog-imports]
      summary: Create a seller-owned draft from an approved import row
      parameters: [*saImportCompanyId, *saImportJobId, *saImportRowId]
      responses:
        "201": { description: Draft created, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "409": { description: Row cannot be drafted, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Draft prerequisites are incomplete, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/catalog-imports/{companyId}/jobs/{jobId}/products/{rowId}/prepare-commercial:
    post:
      operationId: prepareSuperAdminCatalogImportCommercial
      tags: [superadmin, catalog-imports]
      summary: Prepare seller commercial data for a reviewed row
      parameters: [*saImportCompanyId, *saImportJobId, *saImportRowId]
      responses:
        "200": { description: Idempotent commercial preparation result, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "201": { description: Commercial price and MOQ tier created, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "422": { description: Commercial prerequisites are incomplete, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /superadmin/catalog-imports/{companyId}/jobs/{jobId}/products/{rowId}/publish:
    patch:
      operationId: publishSuperAdminCatalogImportProduct
      tags: [superadmin, catalog-imports]
      summary: Publish a seller-owned prepared draft
      description: Explicit, idempotent publication. It validates seller capability, active storefront, taxonomy, price, and positive integer MOQ; no Seller JWT is impersonated.
      parameters: [*saImportCompanyId, *saImportJobId, *saImportRowId]
      responses:
        "200": { description: Published product or idempotent existing publication, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "404": { description: Draft product does not exist, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Publication prerequisites are incomplete, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports:
    get:
      operationId: listCatalogImports
      tags: [catalog-imports]
      summary: List catalog import jobs
      parameters:
        - &companyIdParam { name: companyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Import jobs, content: { application/json: { schema: { type: object, properties: { jobs: { type: array, items: { allOf: [{ $ref: "#/components/schemas/CatalogImportJob" }, { type: object, properties: { totalRows: { type: integer, minimum: 0 } }, required: [totalRows] }] } }, total: { type: integer, minimum: 0 }, page: { type: integer }, pageSize: { type: integer } }, required: [jobs, total, page, pageSize] } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access denied or inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: createCatalogImport
      tags: [catalog-imports]
      summary: Upload a PDF, XLSX, or CSV catalog source
      description: Creates an uploaded import job and starts background parsing. The server never exposes the private storage key.
      parameters: [*companyIdParam]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: PDF, XLSX, or CSV; maximum 50 MiB. }
              required: [file]
      responses:
        "201": { description: Import job created, content: { application/json: { schema: { type: object, properties: { importJob: { $ref: "#/components/schemas/CatalogImportJob" } }, required: [importJob] } } } }
        "400": { description: Missing file or upload error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "413": { description: File exceeds 50 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: MIME/extension mismatch or invalid file signature, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Storage or database error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/stuck:
    get:
      operationId: listStuckCatalogImports
      tags: [catalog-imports]
      summary: List extracted import jobs awaiting enrichment beyond the stuck threshold
      parameters: [*companyIdParam]
      responses:
        "200": { description: Stuck jobs, content: { application/json: { schema: { type: object, properties: { jobs: { type: array, items: { $ref: "#/components/schemas/CatalogImportJob" } }, thresholdMinutes: { type: number } }, required: [jobs, thresholdMinutes] } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access denied or inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}:
    get:
      operationId: getCatalogImport
      tags: [catalog-imports]
      summary: Get an import job and review progress
      parameters:
        - *companyIdParam
        - &importIdParam { name: importId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Import job and row counts, content: { application/json: { schema: { type: object, properties: { importJob: { $ref: "#/components/schemas/CatalogImportJob" }, rowCounts: { type: object, properties: { approved: { type: integer, minimum: 0 }, draftCreated: { type: integer, minimum: 0 } }, required: [approved, draftCreated] } }, required: [importJob, rowCounts] } } } }
        "404": { description: Import job not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      operationId: deleteCatalogImport
      tags: [catalog-imports]
      summary: Permanently delete an import awaiting review
      description: Deletes only the private source file, private staging images, import job, and staging rows. It never deletes commercial products or product media. Active processing and imports that already created a product are rejected.
      parameters: [*companyIdParam, *importIdParam]
      responses:
        "204": { description: Import and all private staging assets deleted }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access denied or inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Import job not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "Import is processing, has created products, or has an invalid storage layout", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: "Storage or database cleanup failed; the job remains available for retry when possible", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}/process:
    post:
      operationId: processCatalogImport
      tags: [catalog-imports]
      summary: Manually parse an uploaded import job
      parameters: [*companyIdParam, *importIdParam]
      responses:
        "200": { description: Processing result, content: { application/json: { schema: { type: object, properties: { result: { type: object, additionalProperties: true } }, required: [result] } } } }
        "404": { description: Import job not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Job is not uploaded, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Processing failed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}/retry:
    post:
      operationId: retryCatalogImport
      tags: [catalog-imports]
      summary: Retry a failed import job without creating another job or duplicate rows
      description: Atomically reclaims a failed job, reuses its stored source file, and preserves existing staging rows. Concurrent retries return an explicit no-op.
      parameters: [*companyIdParam, *importIdParam]
      responses:
        "200": { description: Retry result or concurrent no-op, content: { application/json: { schema: { type: object, properties: { result: { type: object, additionalProperties: true } }, required: [result] } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access denied or inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Import job not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Job is not failed and retry is a no-op, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Retry failed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}/extract:
    post:
      operationId: extractCatalogImport
      tags: [catalog-imports]
      summary: Run AI enrichment for an extracted import job
      parameters: [*companyIdParam, *importIdParam]
      responses:
        "200": { description: Extraction result, content: { application/json: { schema: { type: object, properties: { result: { type: object, additionalProperties: true } }, required: [result] } } } }
        "404": { description: Import job not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Job is not extracted, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: AI extraction failed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}/products:
    get:
      operationId: listCatalogImportRows
      tags: [catalog-imports]
      summary: List extracted staging rows for review
      parameters:
        - *companyIdParam
        - *importIdParam
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: status, in: query, schema: { type: string, enum: [pending_review, approved, dismissed, draft_created] } }
      responses:
        "200": { description: Staging rows, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: "#/components/schemas/CatalogImportRow" } }, total: { type: integer, minimum: 0 }, page: { type: integer }, pageSize: { type: integer } }, required: [data, total, page, pageSize] } } } }
        "404": { description: Import job not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}/products/{rowId}/source-image:
    get:
      operationId: getCatalogImportSourceImage
      tags: [catalog-imports]
      summary: Retrieve one authenticated private source image for a staging row
      parameters:
        - *companyIdParam
        - *importIdParam
        - { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: index
          in: query
          description: Zero-based extracted image index.
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Private source image bytes. The response never contains an object-storage key, path, or signed URL.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "400": { description: Invalid image index, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access denied or inactive, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: "Import job, staging row, or image index not found", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Source object is corrupt or unsupported, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}/products/{rowId}:
    patch:
      operationId: reviewCatalogImportRow
      tags: [catalog-imports]
      summary: Approve or dismiss a pending staging row
      parameters:
        - *companyIdParam
        - *importIdParam
        - &rowIdParam { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CatalogImportReviewRequest" } } } }
      responses:
        "200": { description: Reviewed row, content: { application/json: { schema: { type: object, properties: { product: { $ref: "#/components/schemas/CatalogImportRow" } }, required: [product] } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Import job or staging row not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: Row has already been reviewed, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Suggested category is not in this company, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}/products/{rowId}/draft:
    post:
      operationId: createCatalogImportRowDraft
      tags: [catalog-imports]
      summary: Create a draft product from an approved staging row
      parameters: [*companyIdParam, *importIdParam, *rowIdParam]
      responses:
        "201": { description: Draft product created, content: { application/json: { schema: { type: object, properties: { product: { type: object, additionalProperties: true }, stagingRow: { $ref: "#/components/schemas/CatalogImportRow" } }, required: [product, stagingRow] } } } }
        "404": { description: Import job or staging row not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "Row is not approved, already drafted, or product identifiers conflict", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Suggested category is not in this company, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/catalog-imports/{importId}/drafts:
    post:
      operationId: createCatalogImportDrafts
      tags: [catalog-imports]
      summary: Bulk create draft products from approved staging rows
      parameters: [*companyIdParam, *importIdParam]
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/BulkDraftRequest" } } } }
      responses:
        "200": { description: Bulk creation outcome, content: { application/json: { schema: { type: object, properties: { created: { type: integer, minimum: 0 }, skipped: { type: integer, minimum: 0 }, failed: { type: integer, minimum: 0 }, total: { type: integer, minimum: 0 }, products: { type: array, items: { type: object, properties: { rowId: { type: string, format: uuid }, productId: { type: string, format: uuid } }, required: [rowId, productId] } }, failures: { type: array, items: { type: object, properties: { rowId: { type: string, format: uuid }, error: { type: string } }, required: [rowId, error] } } }, required: [created, skipped, failed, total, products, failures] } } } }
        "404": { description: Import job not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Invalid body, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/products/marketplace-taxonomy:
    get:
      operationId: getSellerMarketplaceTaxonomy
      tags: [products]
      summary: Get the authenticated seller's sector-scoped marketplace taxonomy
      parameters: [*companyIdParam]
      responses:
        "200": { description: "Active mapped root, descendants, product types, and required attributes", content: { application/json: { schema: { $ref: "#/components/schemas/SellerMarketplaceTaxonomyResponse" } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access or product-view permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: "Registration sector, root mapping, or active product types are not configured", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Taxonomy database error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/products/{productId}/prices:
    get:
      operationId: listProductPrices
      tags: [product-prices]
      summary: List a product's prices and MOQ tiers
      parameters:
        - *companyIdParam
        - &productIdParam { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Prices with their tiers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProductPrice" } } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access or pricing-view permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Product not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    post:
      operationId: createProductPrice
      tags: [product-prices]
      summary: Create a product price with optional non-overlapping MOQ tiers
      parameters: [*companyIdParam, *productIdParam]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPriceRequest" } } } }
      responses:
        "201": { description: Price created, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPrice" } } } }
        "400": { description: "Validation error, invalid date range, or overlapping MOQ tiers", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access or pricing-create permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Product not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/products/{productId}/prices/{priceId}:
    patch:
      operationId: updateProductPrice
      tags: [product-prices]
      summary: Update a product price
      parameters:
        - *companyIdParam
        - *productIdParam
        - &priceIdParam { name: priceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPriceUpdateRequest" } } } }
      responses:
        "200": { description: Price updated, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPrice" } } } }
        "400": { description: Validation error or invalid effective date range, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access or pricing-edit permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Price not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/products/{productId}/prices/{priceId}/tiers:
    post:
      operationId: createProductPriceTier
      tags: [product-prices]
      summary: Create a non-overlapping MOQ price tier
      parameters: [*companyIdParam, *productIdParam, *priceIdParam]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPriceTierRequest" } } } }
      responses:
        "201": { description: Tier created, content: { application/json: { schema: { $ref: "#/components/schemas/ProductPriceTier" } } } }
        "400": { description: Validation error or overlapping MOQ tier, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: Company access or pricing-edit permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Price not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/products/{productId}/prices/{priceId}/tiers/{tierId}:
    delete:
      operationId: deleteProductPriceTier
      tags: [product-prices]
      summary: Delete a MOQ price tier
      parameters:
        - *companyIdParam
        - *productIdParam
        - *priceIdParam
        - { name: tierId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Tier deleted }
        "403": { description: Company access or pricing-edit permission denied, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: Price or tier not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /companies/{companyId}/integrations:
    get:
      operationId: listSellerIntegrations
      tags: [integrations]
      parameters: [*companyIdParam]
      responses:
        "200": { description: "Tenant integrations, with redacted configuration", content: { application/json: { schema: { type: object, required: [integrations], properties: { integrations: { type: array, items: { $ref: "#/components/schemas/Integration" } } } } } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "403": { description: "Tenant, entitlement, or permission denied", content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
    post:
      operationId: createSellerIntegration
      tags: [integrations]
      parameters: [*companyIdParam]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateSellerIntegrationRequest" } } } }
      responses:
        "201": { description: Integration created, content: { application/json: { schema: { type: object, required: [integration], properties: { integration: { $ref: "#/components/schemas/Integration" } } } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "403": { description: "Tenant, entitlement, or permission denied", content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "409": { description: "Integration name exists, category is not allowed, or tenant integration quota is exceeded", content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }

  /companies/{companyId}/integrations/{integrationId}:
    get:
      operationId: getSellerIntegration
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Integration, content: { application/json: { schema: { type: object, required: [integration], properties: { integration: { $ref: "#/components/schemas/Integration" } } } } } }
        "404": { description: Integration not found, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
    put:
      operationId: updateSellerIntegration
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateSellerIntegrationRequest" } } } }
      responses:
        "200": { description: Configuration saved; credentials are never returned, content: { application/json: { schema: { type: object, required: [ok, status], properties: { ok: { type: boolean }, status: { type: string, enum: [configuration_required] } } } } } }
        "400": { description: Validation or endpoint error, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "404": { description: Integration not found, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
    delete:
      operationId: deleteSellerIntegration
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Integration deleted (repeat-safe) }

  /companies/{companyId}/integrations/{integrationId}/test:
    post:
      operationId: testSellerIntegration
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Connection test succeeded, content: { application/json: { schema: { type: object, required: [ok, status, httpStatus], properties: { ok: { type: boolean }, status: { type: string, enum: [configuration_required] }, httpStatus: { type: integer } } } } } }
        "409": { description: Configuration required or configuration changed concurrently during the connection test, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "422": { description: Connection test failed, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }

  /companies/{companyId}/integrations/{integrationId}/activate:
    post:
      operationId: activateSellerIntegration
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Integration activated, content: { application/json: { schema: { type: object, required: [integration], properties: { integration: { $ref: "#/components/schemas/Integration" } } } } } }
        "409": { description: Successful test of the current revision required or configuration changed concurrently during activation, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }

  /companies/{companyId}/integrations/{integrationId}/sync:
    post:
      operationId: syncSellerIntegration
      tags: [integrations]
      parameters:
        - *companyIdParam
        - { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: idempotency-key, in: header, required: true, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Existing idempotent sync job replayed, content: { application/json: { schema: { type: object, required: [job, replayed], properties: { job: { $ref: "#/components/schemas/IntegrationSyncJob" }, replayed: { type: boolean, const: true } } } } } }
        "202": { description: Sync job queued, content: { application/json: { schema: { type: object, required: [job], properties: { job: { $ref: "#/components/schemas/IntegrationSyncJob" } } } } } }
        "400": { description: Idempotency key required, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "409": { description: Integration is not connected, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
  /companies/{companyId}/integrations/{integrationId}/webhooks:
    get:
      operationId: listSellerIntegrationWebhooks
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Webhooks, content: { application/json: { schema: { type: object, required: [webhooks], properties: { webhooks: { type: array, items: { $ref: "#/components/schemas/IntegrationWebhook" } } } } } } }
    post:
      operationId: createSellerIntegrationWebhook
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SellerIntegrationWebhookRequest" } } } }
      responses:
        "201": { description: Webhook created, content: { application/json: { schema: { type: object, required: [webhook], properties: { webhook: { $ref: "#/components/schemas/IntegrationWebhook" } } } } } }
        "400": { description: Validation or endpoint error, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "404": { description: Integration not found, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }

  /companies/{companyId}/integrations/{integrationId}/webhooks/{webhookId}:
    put:
      operationId: updateSellerIntegrationWebhook
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }, { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SellerIntegrationWebhookRequest" } } } }
      responses:
        "200": { description: Webhook updated, content: { application/json: { schema: { type: object, required: [webhook], properties: { webhook: { $ref: "#/components/schemas/IntegrationWebhook" } } } } } }
        "400": { description: Validation or endpoint error, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "404": { description: Webhook not found, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
    delete:
      operationId: deleteSellerIntegrationWebhook
      tags: [integrations]
      parameters: [*companyIdParam, { name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }, { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Webhook deleted (repeat-safe) }

  /superadmin/integrations:
    get:
      operationId: listSuperAdminIntegrations
      tags: [superadmin, integrations]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: companyId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [configuration_required, testing, connected, error, suspended] } }
        - { name: provider, in: query, schema: { type: string, enum: [generic_https] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200": { description: Up to 100 sanitized integrations, content: { application/json: { schema: { type: object, additionalProperties: false, required: [integrations, page, limit, nextPage], properties: { integrations: { type: array, items: { $ref: "#/components/schemas/SuperAdminIntegrationSafe" } }, page: { type: integer }, limit: { type: integer }, nextPage: { type: [integer, "null"] } } } } } }
        "401": { description: Super Admin authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "403": { description: Super Admin integrations.read permission required, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
  /superadmin/integrations/{integrationId}/executions:
    get:
      operationId: listSuperAdminIntegrationExecutions
      tags: [superadmin, integrations]
      parameters: [{ name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }]
      responses:
        "200": { description: Sanitized execution diagnostics, content: { application/json: { schema: { type: object, required: [integration, jobs, deliveries], properties: { integration: { $ref: "#/components/schemas/SuperAdminIntegrationSafe" }, jobs: { type: array, items: { $ref: "#/components/schemas/IntegrationSyncJob" } }, deliveries: { type: array, items: { type: object, required: [id, status, attempts, responseStatus, createdAt], properties: { id: { type: string, format: uuid }, status: { type: string }, attempts: { type: integer }, responseStatus: { type: [integer, "null"] }, createdAt: { type: string, format: date-time } } } } } } } } }
        "404": { description: Integration not found, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
  /superadmin/integrations/{integrationId}:
    get:
      operationId: getSuperAdminIntegration
      tags: [superadmin, integrations]
      parameters: [{ name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Sanitized integration, content: { application/json: { schema: { type: object, required: [integration], properties: { integration: { $ref: "#/components/schemas/SuperAdminIntegrationSafe" } } } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "404": { description: Integration not found, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
  /superadmin/integrations/{integrationId}/suspend:
    post:
      operationId: suspendSuperAdminIntegration
      tags: [superadmin, integrations]
      parameters: [{ name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses:
        "200": { description: Integration suspended, content: { application/json: { schema: { type: object, required: [integration], properties: { integration: { $ref: "#/components/schemas/SuperAdminIntegrationSafe" } } } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "404": { description: Integration not found, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
  /superadmin/integrations/{integrationId}/reauthorize:
    post:
      operationId: reauthorizeSuperAdminIntegration
      tags: [superadmin, integrations]
      parameters: [{ name: integrationId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Sanitized integration reset for configuration, content: { application/json: { schema: { type: object, required: [integration], properties: { integration: { $ref: "#/components/schemas/SuperAdminIntegrationSafe" } } } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "409": { description: Integration is not suspended or does not exist, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
  /superadmin/integration-adapters:
    get:
      operationId: listIntegrationAdapters
      tags: [superadmin, integrations]
      responses:
        "200": { description: Adapter metadata suitable for administrative display, content: { application/json: { schema: { type: object, required: [adapters], properties: { adapters: { type: array, items: { type: object, additionalProperties: true } } } } } } }
  /superadmin/integration-adapters/{key}:
    patch:
      operationId: updateIntegrationAdapter
      tags: [superadmin, integrations]
      parameters: [{ name: key, in: path, required: true, schema: { type: string, enum: [generic_https] } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [isActive], properties: { isActive: { type: boolean } } } } } }
      responses:
        "200": { description: Adapter metadata, content: { application/json: { schema: { type: object, required: [adapter], properties: { adapter: { type: object, additionalProperties: true } } } } } }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
        "404": { description: Adapter not found, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationError" } } } }
  /superadmin/integrations-audit:
    get:
      operationId: listIntegrationAudit
      tags: [superadmin, integrations]
      parameters:
