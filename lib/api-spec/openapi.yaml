      x-permission: subscriptions.manage
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [planId], properties: { planId: { type: string, format: uuid }, effectiveNow: { type: boolean } } } } } }
      responses:
        "200": { description: Plan changed, content: { application/json: { schema: { $ref: "#/components/schemas/BillingSubscriptionResponse" } } } }
        "404": { description: Subscription or plan not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: Paid period cannot be rewritten, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /superadmin/subscription-billing/payment-methods:
    get:
      operationId: listSubscriptionPaymentMethods
      tags: [superadmin-subscription-billing]
