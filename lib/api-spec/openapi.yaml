              $ref: "#/components/schemas/InviteUserRequest"
      responses:
        "201":
          description: Invitation created and OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

    get:
      operationId: listInvitations
      tags: [invitations]
      summary: List company invitations
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, accepted, rejected, cancelled, expired, otp_blocked]
      responses:
        "200":
          description: List of invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"

  /companies/{companyId}/invitations/{invitationId}:
    delete:
      operationId: cancelInvitation
      tags: [invitations]
      summary: Cancel a pending invitation
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /invitations/{invitationId}/reject:
    post:
      operationId: rejectInvitation
      tags: [invitations]
      security: []
      summary: Explicitly reject an invitation (by invitee)
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Invitation rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          description: Cannot reject — already accepted, cancelled, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

